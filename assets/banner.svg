<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="320" viewBox="0 0 1280 320" role="img" aria-label="苟大豆">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#121215"/>
      <stop offset="1" stop-color="#1d1d23"/>
    </linearGradient>
    <linearGradient id="red" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e8112a"/>
      <stop offset="1" stop-color="#9c0716"/>
    </linearGradient>
    <pattern id="dots" width="26" height="26" patternUnits="userSpaceOnUse">
      <circle cx="1.4" cy="1.4" r="1.4" fill="#ffffff" opacity="0.07"/>
    </pattern>
  </defs>

  <rect width="1280" height="320" fill="url(#bg)"/>
  <rect width="1280" height="320" fill="url(#dots)"/>

  <g fill="none" stroke="#ffffff" stroke-opacity="0.06">
    <circle cx="1090" cy="52" r="250"/>
    <circle cx="1090" cy="52" r="180"/>
  </g>

  <rect x="0" y="0" width="8" height="320" fill="url(#red)"/>

  <text x="88" y="134" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Noto Sans SC',sans-serif" font-size="72" font-weight="700" fill="#ffffff">苟大豆</text>
  <text x="92" y="180" font-family="'SF Mono',Menlo,Consolas,monospace" font-size="16" letter-spacing="8" fill="#ff4459">G O U &#160; D A D O U</text>
  <text x="90" y="236" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Noto Sans SC',sans-serif" font-size="24" fill="#a6a6ae">库迪咖啡前员工</text>

  <g transform="translate(1128,156)">
    <rect x="-66" y="-66" width="132" height="132" rx="36" fill="url(#red)"/>
    <text x="0" y="27" text-anchor="middle" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-size="74" font-weight="700" fill="#ffffff">豆</text>
  </g>
